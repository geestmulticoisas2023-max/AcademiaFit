{% extends 'base.html' %}{% block content %}<h2>Cadastro de alunos</h2><form method="post"><label>Nome<input name="nome" required></label><label>E-mail<input type="email" name="email" required></label><label>Telefone<input name="telefone" required></label><button>Cadastrar aluno</button></form><h3>Alunos cadastrados</h3><table><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Telefone</th></tr>{% for a in registros %}<tr><td>{{ a.id }}</td><td>{{ a.nome }}</td><td>{{ a.email }}</td><td>{{ a.telefone }}</td></tr>{% else %}<tr><td colspan="4">Nenhum aluno cadastrado.</td></tr>{% endfor %}</table>{% endblock %}
